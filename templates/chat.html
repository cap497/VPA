<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VPA — Assistente de Manuais</title>
  <style>
    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{ font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial; }

    /* GRID 2 COLUNAS */
    .layout{
      display:grid;
      grid-template-columns:600px minmax(0,1fr);
      width:100%;
      height:100dvh;
      overflow:hidden;
    }
    .sidebar,.main{ min-width:0; min-height:0; }

    /* Sidebar */
    .sidebar{
      display:flex;
      flex-direction:column;
      border-right:1px solid #e6e6e6;
      padding:14px 12px;
      background:#fafafa;
      overflow:hidden;
    }
/*     .side-header h1{margin:0;font-size:20px}
    .side-header .muted{margin:2px 0 12px;color:#666;font-size:12px}
 */
    .vehicle-picker{margin-bottom:16px; flex:0 0 auto;}
    .vehicle-picker h2, .sensors h2{margin:10px 0 6px;font-size:14px}

    .btn-row{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
      width:100%;
    }
    .btn-row button{
      padding:8px 6px;
      border:1px solid #ccc;
      background:#fff;
      border-radius:8px;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .btn-row button.active{ background:#0b5fff; color:#fff; border-color:#0b5fff }

    /* Sensores */
    .sensors{ flex:1 1 auto; overflow:auto; }
    .sensors .row{ display:flex; gap:8px; align-items:center; margin:8px 0 }
    .ghost{ background:#fff; border:1px solid #999; color:#222; border-radius:8px; padding:6px 10px; cursor:pointer }

    /* Cartões de gráfico */
    .chart-wrap{
      position:relative;
      padding:8px;
      border:1px solid #eee;
      border-radius:10px;
      background:#fff;
      margin-bottom:12px;
    }
    .chart-wrap canvas{ width:100%; height:180px; display:block; }

    /* Controles sobrepostos (pedais/volante) */
    .overlay-controls{
      position:absolute; inset:8px 8px auto auto;
      display:flex; gap:10px; align-items:center; background:rgba(255,255,255,.9);
      padding:6px 8px; border:1px solid #ddd; border-radius:8px;
    }
    .overlay-controls.right{ right:8px; left:auto; }
    .overlay-range{ display:flex; align-items:center; gap:6px; font-size:12px; }
    .overlay-range input[type="range"]{ width:120px }

    /* Filtro de janela (10s/20s/30s) */
    .window-controls{
      display:flex; align-items:center; gap:8px; margin:6px 0 12px;
      font-size:12px; color:#333;
    }
    .window-controls select{ padding:4px 6px; border:1px solid #ccc; border-radius:6px; }

    /* Coluna direita: chat */
    .main{
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#fff;
    }
    .messages{ flex:1 1 auto; overflow:auto; padding:16px; }
    .message{ margin:10px 0; display:flex }
    .message.user{ justify-content:flex-end }
    .message .bubble{ max-width:820px; padding:10px 12px; border-radius:12px; line-height:1.45; box-shadow:0 1px 2px rgba(0,0,0,.06) }
    .message.user .bubble{ background:#0b5fff; color:#fff; border-top-right-radius:4px }
    .message.bot .bubble{ background:#f1f3f5; border-top-left-radius:4px }

    .gallery{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px }
    .gallery a{ display:block; border:1px solid #ddd; border-radius:8px; overflow:hidden; background:#fff }
    .gallery a.broken{ border-color:#f33 }
    .gallery img{ display:block; max-height:220px; max-width:320px }

    /* Composer */
    .composer{
      display:flex;
      gap:8px;
      padding:12px;
      border-top:1px solid #e6e6e6;
      background:#fafafa;
    }
    .composer input{ flex:1; padding:10px; border:1px solid #ccc; border-radius:10px }
    .composer button{ padding:10px 16px; border:1px solid #0b5fff; background:#0b5fff; color:#fff; border-radius:10px; cursor:pointer }

    /* Indicador de digitação */
    #typingIndicator{
      display:none;
      gap:4px;
      margin:6px 16px 8px auto;
      justify-content:flex-end;
      align-items:center;
    }
    #typingIndicator.show{ display:flex; }
    #typingIndicator span{
      width:6px; height:6px;
      background:#444;
      border-radius:50%;
      opacity:.3;
      display:inline-block;
      animation: blink 1.2s infinite;
    }
    #typingIndicator span:nth-child(2){ animation-delay:.2s; }
    #typingIndicator span:nth-child(3){ animation-delay:.4s; }
    @keyframes blink {
      0% { opacity:.3; transform:translateY(0); }
      20%{ opacity:1;  transform:translateY(-1px); }
      100%{ opacity:.3; transform:translateY(0); }
    }

    .thermo-container {
      display: flex;
      padding: 30px;
      gap: 20%;
      justify-content: center;
      align-items: flex-end;
      height: 250px;
      position: relative;
    }

    .thermo {
      width: 40px;
      height: 200px;
      background: #eee;
      border-radius: 6px;
      border: 1px solid #ccc;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* parte interna da barra */
    .thermo .bar {
      width: 100%;
      height: 0%;
      position: absolute;
      bottom: 0;
      overflow: hidden;
      border-radius: 6px;
      transition: height 0.3s ease-in-out;
    }

    /* preenchimento colorido */
    .thermo .bar .fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(to top, #00ff00 0%, #ffff00 35%, #ff0000 115%);
      transition: height 0.3s ease;
    }

    /* valor acima da barra */
    .thermo .label {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
      color: #111;
      position: absolute;
      top: -20px;
    }

    /* nome abaixo da barra */
    .thermo .name {
      margin-top: 5px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      text-align: center;
      position: absolute;
      bottom: -25px;
    }

    .thermo-container .line {
      position: absolute;
      left: 30;
      width: 70%;
      border-top: 1px dashed #666;
      pointer-events: none;
      z-index: 0;
    }

    .thermo-container .line.label {
      font-size: 12px;
      color: #333;
      position: absolute;
      left: 0;
    }

    .thermo-container .line1 {
      position: absolute;
      left: 30;
      width: 70%;
      pointer-events: none;
      z-index: 0;
      bottom: 12.5%;
    }

    .thermo-container .line2 {
      bottom: 39%;
    }

    .thermo-container .line3 {
      bottom: 64.5%;
    }

    .lbll1 {color: #00ff00;}
    .lbll2 {color: #ffcc00;}
    .lbll3 {color: #ff0000;}

    .thermo-container .label-line {
      position: absolute;
      left: -60px;
      top: -40px;
      font-size: 14px;
      font-weight: bold;
    }

    #micBtn.recording {
      background: #d9534f !important;
      border-color: #d9534f !important;
    }

  </style>
</head>

<body>
  <div class="layout">
    <!-- Coluna Esquerda -->
    <aside class="sidebar">

      <section class="vehicle-picker">
        <h1>VPA - Vehicular Personal Agent</h1>
        <div class="btn-row" id="vehicleButtons">
          <button data-model="Fiat Argo">Fiat Argo</button>
          <button data-model="Hyundai HB20">Hyundai HB20</button>
          <button data-model="Renault Kwid">Renault Kwid</button>
          <button data-model="Chevrolet Onix">Chevrolet Onix</button>
          <button data-model="VW T-Cross">VW T-Cross</button>
        </div>
      </section>

      <section class="sensors">
        <div class="row" style="justify-content:space-between; align-items:center">
          <h1 style="margin:10px 0">Telemetria</h1>
          <div>
            <button id="modeToggle" class="ghost">Usando: Simulado</button>
          </div>
        </div>

        <div class="window-controls">
          Janela de tempo:
          <select id="winSel">
            <option value="10">10 s</option>
            <option value="20" selected>20 s</option>
            <option value="30">30 s</option>
          </select>
        </div>
        
        <!-- Termômetros -->
        <div class="chart-wrap">
          <div class="thermo-container">
            <div class="line1"><span class="label-line lbll1">Calmo</span></div>
            <div class="line line2"><span class="label-line lbll2">Normal</span></div>
            <div class="line line3"><span class="label-line lbll3">Agressivo</span></div>

            <div class="thermo" id="thermo1">
              <div class="label">0.00</div>
              <div class="bar">
                <div class="fill"></div>
              </div>
              <div class="name">Central</div>
            </div>

            <div class="thermo" id="thermo2">
              <div class="label">0.00</div>
              <div class="bar">
                <div class="fill"></div>
              </div>
              <div class="name">FedAvg</div>
            </div>

            <div class="thermo" id="thermo3">
              <div class="label">0.00</div>
              <div class="bar">
                <div class="fill"></div>
              </div>
              <div class="name">FedProx</div>
            </div>
          </div>
        </div>

        <!-- Velocidade com pedais sobrepostos -->
        <div class="chart-wrap">
          <div class="overlay-controls">
            <label class="overlay-range">
              Acelerador
              <input id="throttle" type="range" min="0" max="100" value="0" />
              <span id="throttleVal">0%</span>
            </label>
            <label class="overlay-range">
              Freio
              <input id="brake" type="range" min="0" max="100" value="0" />
              <span id="brakeVal">0%</span>
            </label>
          </div>
          <canvas id="chartSpeed"></canvas>
        </div>

        <!-- RPM -->
        <div class="chart-wrap">
          <canvas id="chartRpm"></canvas>
        </div>

        <!-- Posição do Pedal -->
        <div class="chart-wrap">
          <canvas id="chartPedal"></canvas>
        </div>

        <!-- Aceleração longitudinal -->
        <div class="chart-wrap">
          <canvas id="chartLongAccel"></canvas>
        </div>

        <!-- Aceleração lateral com volante sobreposto -->
        <div class="chart-wrap">
          <div class="overlay-controls right">
            <label class="overlay-range">
              Volante
              <input id="steer" type="range" min="-100" max="100" value="0" />
              <span id="steerVal">0</span>
            </label>
            <div class="row" style="gap:6px; justify-content:flex-end">
              <button id="steerLeft" class="ghost">↶ Esq</button>
              <button id="steerCenter" class="ghost">• Centro</button>
              <button id="steerRight" class="ghost">↷ Dir</button>
            </div>
          </div>
          <canvas id="chartLatAccel"></canvas>
        </div>
      </section>
    </aside>

    <!-- Coluna Direita -->
    <main class="main">
      <div id="messages" class="messages"></div>

      <!-- Indicador de digitação -->
      <div id="typingIndicator"><span></span><span></span><span></span></div>

      <footer class="composer">
        <input id="userInput" type="text" placeholder="Digite sua pergunta..." />

        <!-- 🔊 Botão de microfone -->
        <button id="micBtn" type="button" style="
            padding: 10px 16px;
            border: 1px solid #666;
            background: #666;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
        ">
          🎤
        </button>

        <button id="sendBtn">Enviar</button>
      </footer>
    </main>
  </div>

  <script>
    /* ===================== Modelo selecionado ===================== */
    let currentVehicleModel = "";
    function setActiveModel(model) {
      currentVehicleModel = model;
      document.querySelectorAll('#vehicleButtons button').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-model') === model);
      });
    }
    document.getElementById('vehicleButtons').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-model]');
      if (!btn) return;
      setActiveModel(btn.getAttribute('data-model'));
    });

    /* ============== Chat + reticências + LM Studio status ============== */
    const typing = document.getElementById('typingIndicator');
    let statusTimer = null;
    function showDots(){ typing.classList.add('show'); }
    function hideDots(){ typing.classList.remove('show'); }

    async function checkLMStatusOnce(){
      try{
        const r = await fetch('/lm_status', { cache:'no-store' });
        const j = await r.json();
        return !!j.loaded;
      }catch{ return false; }
    }
    function startStatusPolling(onUnloaded){
      if (statusTimer) clearInterval(statusTimer);
      statusTimer = setInterval(async ()=>{
        const loaded = await checkLMStatusOnce();
        if (!loaded && typeof onUnloaded==='function') onUnloaded();
      }, 1500);
    }
    function stopStatusPolling(){ if (statusTimer){ clearInterval(statusTimer); statusTimer=null; } }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('userInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    function addMessage(payload, sender) {
      const container = document.getElementById('messages');
      const wrap = document.createElement('div');
      wrap.className = 'message ' + sender;

      // bolha de texto (sem animação – para mensagens do usuário)
      if (payload.text) {
        const p = document.createElement('div');
        p.className = 'bubble';
        p.textContent = payload.text;
        wrap.appendChild(p);
      }

      // galeria de imagens (se houver)
      if (payload.images && payload.images.length) {
        const gallery = document.createElement('div');
        gallery.className = 'gallery';
        payload.images.forEach(src => {
          const a = document.createElement('a'); a.href = src; a.target = '_blank';
          const img = document.createElement('img');
          img.src = src; img.alt = 'asset';
          img.loading = 'lazy';
          img.onerror = () => { img.alt = 'imagem não encontrada'; a.classList.add('broken'); };
          a.appendChild(img);
          gallery.appendChild(a);
        });
        wrap.appendChild(gallery);
      }

      container.appendChild(wrap);
      container.scrollTop = container.scrollHeight;
    }

    function addBotStreamingMessage(text, images) {
      const container = document.getElementById('messages');

      // wrapper e bolha
      const wrap = document.createElement('div');
      wrap.className = 'message bot';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = ''; // começa vazia
      wrap.appendChild(bubble);

      // galeria de imagens (se existir)
      if (images && images.length) {
        const gallery = document.createElement('div');
        gallery.className = 'gallery';
        images.forEach(src => {
          const a = document.createElement('a'); a.href = src; a.target = '_blank';
          const img = document.createElement('img');
          img.src = src; img.alt = 'asset';
          img.loading = 'lazy';
          img.onerror = () => { img.alt = 'imagem não encontrada'; a.classList.add('broken'); };
          a.appendChild(img);
          gallery.appendChild(a);
        });
        wrap.appendChild(gallery);
      }

      container.appendChild(wrap);
      container.scrollTop = container.scrollHeight;

      // animação palavra por palavra
      const parts = text.split(/(\s+)/); // mantém espaços
      let idx = 0;

      function step() {
        if (idx >= parts.length) return;
        bubble.textContent += parts[idx];
        idx++;
        container.scrollTop = container.scrollHeight;
        setTimeout(step, 40); // ajuste a velocidade aqui (ms)
      }

      // pequeno delay inicial (≈ 1s) antes de começar a “digitar”
      setTimeout(step, 1000);
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const btn   = document.getElementById('sendBtn');
      const message   = input.value.trim();
      const maxTokens = 500; // mantido simples aqui

      if (!message) return;
      if (!currentVehicleModel) {
        addMessage({text: 'Selecione um modelo antes de perguntar.'}, 'bot');
        return;
      }

      // mensagem do usuário
      addMessage({text: message}, 'user');
      input.value = '';

      const loadedBefore = await checkLMStatusOnce();
      if (!loadedBefore) {
        addMessage({text: 'O modelo local está carregando. Aguarde alguns instantes...'}, 'bot');
      }

      showDots();
      let warnedUnload = false;
      startStatusPolling(() => {
        if (!warnedUnload) {
          warnedUnload = true;
          addMessage({text: 'Aviso: o modelo local foi descarregado. Aguardando recarga automática...'}, 'bot');
        }
      });

      input.disabled = true;
      btn.disabled   = true;

      try {
        const res = await fetch('/ask_stream', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            question: message,
            vehicleModel: currentVehicleModel,
            maxContextTokens: maxTokens
          })
        });

        if (!res.ok || !res.body) {
          addMessage({text: 'Falha ao iniciar streaming de resposta.'}, 'bot');
          return;
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();

        // cria a mensagem do bot vazia onde vamos anexar tokens
        const container = document.getElementById('messages');
        const wrap   = document.createElement('div');
        wrap.className = 'message bot';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = '';
        wrap.appendChild(bubble);
        container.appendChild(wrap);
        container.scrollTop = container.scrollHeight;

        let buffer = '';
        let galleryCreated = false;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let idx;
          while ((idx = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (!line) continue;

            let evt;
            try {
              evt = JSON.parse(line);
            } catch (e) {
              console.error('Erro parse streaming:', e, line);
              continue;
            }

            if (evt.type === 'images') {
              const imgs = evt.images || [];
              if (imgs.length && !galleryCreated) {
                galleryCreated = true;
                const gallery = document.createElement('div');
                gallery.className = 'gallery';
                imgs.forEach(src => {
                  const a = document.createElement('a');
                  a.href = src; a.target = '_blank';
                  const img = document.createElement('img');
                  img.src = src;
                  img.alt = 'asset';
                  img.loading = 'lazy';
                  img.onerror = () => {
                    img.alt = 'imagem não encontrada';
                    a.classList.add('broken');
                  };
                  a.appendChild(img);
                  gallery.appendChild(a);
                });
                wrap.appendChild(gallery);
              }
            } else if (evt.type === 'delta') {
              bubble.textContent += evt.text;
              container.scrollTop = container.scrollHeight;
            } else if (evt.type === 'error') {
              bubble.textContent += '\n[erro: ' + (evt.error || 'desconhecido') + ']';
            } else if (evt.type === 'done') {
              // nada a fazer
            }
          }
        }

      } catch (err) {
        console.error(err);
        addMessage({text: 'Falha de rede durante streaming.'}, 'bot');
      } finally {
        hideDots();
        stopStatusPolling();
        input.disabled = false;
        btn.disabled   = false;
        input.focus();
      }
    }

    /* ==================== Telemetria (Sim/Real) ==================== */
    const modeBtn = document.getElementById('modeToggle');
    let dataMode = 'sim'; // 'sim' | 'real'
    let simEnabled = false;

    modeBtn.addEventListener('click', ()=>{
      dataMode = (dataMode === 'sim') ? 'real' : 'sim';
      modeBtn.textContent = 'Usando: ' + (dataMode === 'sim' ? 'Simulado' : 'Real');
      const disabled = (dataMode === 'real');
      [elThrottle, elBrake, elSteer].forEach(el => el.disabled = disabled);
    });

    // Seletor de janela
    const winSel = document.getElementById('winSel');

    // Controles sobrepostos
    const elThrottle = document.getElementById('throttle');
    const elBrake    = document.getElementById('brake');
    const elSteer    = document.getElementById('steer');
    const throttleVal = document.getElementById('throttleVal');
    const brakeVal    = document.getElementById('brakeVal');
    const steerVal    = document.getElementById('steerVal');

    // Gráficos
    const cvsSpeed = document.getElementById('chartSpeed');
    const cvsRpm = document.getElementById('chartRpm');
    const cvsPedal = document.getElementById('chartPedal');
    const cvsLongA = document.getElementById('chartLongAccel');
    const cvsLatA  = document.getElementById('chartLatAccel');

    // Canvas utilitário (HiDPI)
    function prepareCanvas(canvas){
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const cssW = (rect.width || canvas.parentElement?.clientWidth || 520);
      const cssH = (rect.height || 180);
      const wantW = Math.max(1, Math.round(cssW * dpr));
      const wantH = Math.max(1, Math.round(cssH * dpr));
      if (canvas.width !== wantW || canvas.height !== wantH){
        canvas.width = wantW; canvas.height = wantH;
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      return {ctx, width: cssW, height: cssH};
    }

    // Séries + janela de tempo
    let POLL_MS = 300;
    let WINDOW_SECONDS = Number(winSel.value) || 20;
    let MAXPTS = Math.ceil(WINDOW_SECONDS * 1000 / POLL_MS);
    const seriesSpeed = [], seriesLongA = [], seriesLatA = [], seriesRpm = [], seriesPedal = [];
    function pushSeries(arr, y){ arr.push({t: Date.now(), y}); if (arr.length > MAXPTS) arr.shift(); }
    function setTimeWindow(seconds){
      WINDOW_SECONDS = Math.max(2, Number(seconds)||20);
      MAXPTS = Math.ceil(WINDOW_SECONDS * 1000 / POLL_MS);
      [seriesSpeed, seriesLongA, seriesLatA, seriesRpm, seriesPedal].forEach(arr => { while (arr.length > MAXPTS) arr.shift(); });
    }
    winSel.addEventListener('change', e => setTimeWindow(e.target.value));

    // Desenho
    function drawLineChart(canvas, series, opts){
      const {ctx, width:W, height:H} = prepareCanvas(canvas);
      ctx.clearRect(0,0,W,H);

      // Título
      const title = opts?.title || '';
      const titleH = title ? 18 : 0;
      if (title) {
        ctx.fillStyle = '#222';
        ctx.font = '13px system-ui';
        ctx.textAlign = 'left';
        ctx.fillText(title, 6, 14);
      }

      // Área do gráfico
      const marginLeft = 42, marginRight = 12, marginTop = 6 + titleH, marginBottom = 14;
      const plotX0 = marginLeft, plotY0 = marginTop;
      const plotW  = Math.max(1, W - marginLeft - marginRight);
      const plotH  = Math.max(1, H - marginTop - marginBottom);

      // Fundo + moldura + grades leves
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
      for (let i=1;i<4;i++){
        const y = plotY0 + (plotH/4)*i;
        ctx.beginPath(); ctx.moveTo(plotX0, y); ctx.lineTo(plotX0 + plotW, y); ctx.stroke();
      }
      ctx.strokeStyle = '#ccc';
      ctx.strokeRect(plotX0, plotY0, plotW, plotH);

      // Escala Y
      let minY = ('min' in opts) ? opts.min : (series.length? Math.min(...series.map(p=>p.y)) : 0);
      let maxY = ('max' in opts) ? opts.max : (series.length? Math.max(...series.map(p=>p.y)) : 1);
      if (minY === maxY) { minY -= 1; maxY += 1; }
      const yToPix = y => plotY0 + plotH - ((y - minY) / (maxY - minY)) * plotH;

      // Rótulos do eixo Y (min/max)
      ctx.fillStyle = '#666';
      ctx.font = '11px system-ui';
      ctx.textAlign = 'right';
      const unit = opts?.unit ? ` ${opts.unit}` : '';
      ctx.fillText(minY.toFixed(1) + unit, plotX0 - 6, Math.min(H-4, yToPix(minY)));
      ctx.fillText(maxY.toFixed(1) + unit, plotX0 - 6, Math.max(12, yToPix(maxY)));

      // Série
      if (series.length >= 2){
        const xScale = plotW / Math.max(1, series.length-1);
        ctx.strokeStyle = '#0b5fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i=0;i<series.length;i++){
          const x = plotX0 + i*xScale;
          const y = yToPix(series[i].y);
          if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }

      // Badge atual
      const curr = (series.length ? series[series.length-1].y : 0);
      const badge = opts?.unit ? `${curr.toFixed(2)} ${opts.unit}` : curr.toFixed(2);
      ctx.font = '11px system-ui';
      const m = ctx.measureText(badge);
      const pad = 6, bx = W - (m.width + pad*2) - 12, by = plotY0 + 4, bh = 18;
      ctx.fillStyle = '#0b5fff';
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, m.width+pad*2, bh, 6); ctx.fill(); }
      else { ctx.fillRect(bx, by, m.width+pad*2, bh); }
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.fillText(badge, bx+pad, by+bh-6);
    }

    // Acelerações
    let _lastSpd = null, _lastTs = null;
    function computeLongitudinalAccel(speedKmH){
      const now = Date.now(); let a = 0;
      if (_lastSpd != null && _lastTs != null){
        const dt = (now - _lastTs)/1000;
        const v0 = _lastSpd*(1000/3600), v1 = speedKmH*(1000/3600);
        if (dt>0) a = (v1 - v0)/dt;
      }
      _lastSpd = speedKmH; _lastTs = now; return a;
    }
    function computeLateralAccel(speedKmH, steerNorm){
      const v = speedKmH*(1000/3600), k = 0.015;
      return k * steerNorm * v * v;
    }

    // Fontes de dados
    async function fetchSim(){
      const res = await fetch('/sim_sensors/readings');
      if (!res.ok) throw new Error('sim fetch ' + res.status);
      const d = await res.json();
      simEnabled = !!d.enabled;
      return d;
    }
    async function fetchReal(){
      const res = await fetch('/sensors'); // ajuste se necessário
      if (!res.ok) throw new Error('real fetch ' + res.status);
      const js = await res.json();
      const r = (js.readings && js.readings.length) ? js.readings[0].data : {};
      const cl = js.classes ?? [];
      const speed = Number(r.speed ?? r.velocidade ?? 0);
      const rpm = Number(r.engine_speed ?? r.rpm ?? 900);
      const pedal = Number(r.throttle_position ?? r.throttle ?? r.pedal_pos ?? r.pedal_position ?? 0);
      const accelx = Number(r.accel_x ?? r.acc_long ?? 0);
      const accely = Number(r.accel_y ?? r.acc_lat ?? 0);
      const class_central = Number(cl[0] ?? 0.0);
      const class_fedavg = Number(cl[1] ?? 0.0);
      const class_fedprox = Number(cl[2] ?? 0.0);
      return {
        timestamp: Date.now(),
        speed,
        rpm,
        pedal,
        accelx,
        accely,
        class_central,
        class_fedavg,
        class_fedprox,
        enabled: true
      };
    }

    // Termômetros
    function updateThermo(id, value) {
      const thermo = document.getElementById(id);
      if (!thermo) return;
      const bar = thermo.querySelector(".bar");
      const label = thermo.querySelector(".label");
      const percent = Math.min(Math.max((value / 3) * 100, 0), 100);

      if (bar) {
        requestAnimationFrame(() => { 
          bar.style.height = `${percent}%`;
        });
      }
      if (label) {
        label.textContent = value.toFixed(2);
      }
    }

    function clip(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    let AlertSent = false;
    // Loop
    async function pollTelemetry(){
      try{
        const data = (dataMode === 'sim') ? await fetchSim() : await fetchReal();
        // Sliders
        const thPct = Math.round((Number(data.throttle)||0)*100);
        const brPct = Math.round((Number(data.brake)||0)*100);
        const stPct = Math.round((Number(data.steer)||0)*100);
        const disabled = (dataMode === 'real');
        [elThrottle, elBrake, elSteer].forEach(el => el.disabled = disabled);
        elThrottle.value = thPct; throttleVal.textContent = thPct + '%';
        elBrake.value    = brPct; brakeVal.textContent    = brPct + '%';
        elSteer.value    = stPct; steerVal.textContent    = stPct;

        // séries
        pushSeries(seriesSpeed, (Number(data.speed)||0));
        pushSeries(seriesRpm, (Number(data.rpm)||0));
        pushSeries(seriesPedal, (Number(data.pedal)||0));
        pushSeries(seriesLongA, (Number(data.accelx)||0));
        pushSeries(seriesLatA,  (Number(data.accely)||0));

        // Desenhar
        drawLineChart(cvsSpeed, seriesSpeed, { min:0, max:180, title:'Velocidade (km/h)', unit:'km/h', yLabels:'minmax' });
        drawLineChart(cvsRpm,   seriesRpm,   { min:0, max:8000, title:'RPM', unit:'rpm', yLabels:'minmax' });
        drawLineChart(cvsPedal, seriesPedal, { min:0, max:100, title:'Posição do Pedal (%)', unit:'%', yLabels:'minmax' });
        drawLineChart(cvsLongA, seriesLongA, { min:-6, max:6, title:'Aceleração Longitudinal (m/s²)', unit:'m/s²', yLabels:'minmax' });
        drawLineChart(cvsLatA,  seriesLatA,  { min:-6, max:6, title:'Aceleração Lateral (m/s²)',      unit:'m/s²', yLabels:'minmax' });

        // Termômetros
        updateThermo("thermo1", data.class_central);
        updateThermo("thermo2", data.class_fedavg);
        updateThermo("thermo3", data.class_fedprox);
        
        cc = clip(Math.round(data.class_central), 1, 3)
        cf = clip(Math.round(data.class_fedavg), 1, 3)
        cp = clip(Math.round(data.class_fedprox), 1, 3)
        if (!AlertSent && (cc === 3 || cf === 3 || cp === 3)) {
            addMessage({ text: 'Direção agressiva detectada!' }, 'bot');
            AlertSent = true;
        }
        if (cc < 3 && cf < 3 && cp < 3) {
            AlertSent = false;
        }

      }catch(e){
        // ainda redesenha “vazios”
        drawLineChart(cvsSpeed, seriesSpeed, { min:0, max:180, title:'Velocidade (km/h)', unit:'km/h', yLabels:'minmax' });
        drawLineChart(cvsRpm,   seriesRpm,   { min:0, max:8000, title:'RPM', unit:'rpm', yLabels:'minmax' });
        drawLineChart(cvsPedal, seriesSpeed, { min:0, max:100, title:'Posição do Pedal (%)', unit:'%', yLabels:'minmax' });
        drawLineChart(cvsLongA, seriesLongA, { min:-6, max:6, title:'Aceleração Longitudinal (m/s²)', unit:'m/s²', yLabels:'minmax' });
        drawLineChart(cvsLatA,  seriesLatA,  { min:-6, max:6, title:'Aceleração Lateral (m/s²)',      unit:'m/s²', yLabels:'minmax' });
      }finally{
        setTimeout(pollTelemetry, 300);
      }
    }

    // Inicial
    drawLineChart(cvsSpeed, seriesSpeed, { min:0, max:180, title:'Velocidade (km/h)', unit:'km/h', yLabels:'minmax' });
    drawLineChart(cvsRpm,   seriesRpm,   { min:0, max:8000, title:'RPM', unit:'rpm', yLabels:'minmax' });
    drawLineChart(cvsPedal, seriesSpeed, { min:0, max:100, title:'Posição do Pedal (%)', unit:'%', yLabels:'minmax' });
    drawLineChart(cvsLongA, seriesLongA, { min:-6, max:6, title:'Aceleração Longitudinal (m/s²)', unit:'m/s²', yLabels:'minmax' });
    drawLineChart(cvsLatA,  seriesLatA, { min:-6, max:6, title:'Aceleração Lateral (m/s²)',      unit:'m/s²', yLabels:'minmax' });
    pollTelemetry();

    // Comandos sim (auto-ligar se desligado)
    async function sendSimControl(delta){
      if (dataMode !== 'sim') return;
      try{
        if (!simEnabled){
          const t = await fetch('/sim_sensors/toggle', {method:'POST'});
          const j = await t.json(); simEnabled = !!j.enabled;
        }
        await fetch('/sim_sensors/control', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(delta)
        });
      }catch{}
    }
    const clamp = (v,min,max)=> Math.max(min, Math.min(max,v));
    ['input','change'].forEach(evt => {
      elThrottle.addEventListener(evt, () => { throttleVal.textContent = elThrottle.value+'%'; sendSimControl({ throttle: clamp(elThrottle.value/100,0,1) });});
      elBrake.addEventListener(evt,    () => { brakeVal.textContent    = elBrake.value+'%';    sendSimControl({ brake:    clamp(elBrake.value/100,   0,1) });});
      elSteer.addEventListener(evt,    () => { steerVal.textContent    = elSteer.value;        sendSimControl({ steer:    clamp(elSteer.value/100, -1,1) });});
    });
    document.getElementById('steerLeft').addEventListener('click',  ()=>{ elSteer.value = -100; elSteer.dispatchEvent(new Event('input')); });
    document.getElementById('steerCenter').addEventListener('click',()=>{ elSteer.value = 0;    elSteer.dispatchEvent(new Event('input')); });
    document.getElementById('steerRight').addEventListener('click', ()=>{ elSteer.value = 100;  elSteer.dispatchEvent(new Event('input')); });

    // Redesenhar em resize
    window.addEventListener('resize', () => {
      drawLineChart(cvsSpeed, seriesSpeed, { min:0, max:180, title:'Velocidade (km/h)', unit:'km/h', yLabels:'minmax' });
      drawLineChart(cvsRpm,   seriesRpm,   { min:0, max:8000, title:'RPM', unit:'rpm', yLabels:'minmax' });
      drawLineChart(cvsPedal, seriesSpeed, { min:0, max:100, title:'Posição do Pedal (%)', unit:'%', yLabels:'minmax' });
      drawLineChart(cvsLongA, seriesLongA, { min:-6, max:6, title:'Aceleração Longitudinal (m/s²)', unit:'m/s²', yLabels:'minmax' });
      drawLineChart(cvsLatA,  seriesLatA, { min:-6, max:6, title:'Aceleração Lateral (m/s²)',      unit:'m/s²', yLabels:'minmax' });
    });

    /* ==================== Voz (Web Speech API) ==================== */

    const micBtn = document.getElementById("micBtn");
    const userInput = document.getElementById("userInput");
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          sendAudioToASR(blob);
        };

        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "⏹"; // muda ícone durante gravação
      } catch (err) {
        console.error("Erro ao iniciar microfone:", err);
        alert("Não foi possível acessar o microfone.");
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.textContent = "🎤";
      }
    }

    micBtn.addEventListener("click", () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });

    // --- Envia para /asr ---
    async function sendAudioToASR(audioBlob) {
      const formData = new FormData();
      formData.append("audio", audioBlob, "audio.webm");

      try {
        const res = await fetch("/asr", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();
        if (!data.ok) {
          alert("Não foi possível transcrever o áudio.");
          return;
        }

        const text = data.text.trim();
        if (!text) {
          alert("Não entendi o áudio. Tente novamente.");
          return;
        }

        userInput.value = text;

        // se quiser que envie automaticamente:
        // document.getElementById("sendBtn").click();

      } catch (err) {
        console.error("Erro no ASR:", err);
        alert("Erro ao processar o áudio.");
      }
    }

  </script>
